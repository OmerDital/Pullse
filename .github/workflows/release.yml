# Every push to main: test, build, and release when CHANGELOG.md has notes under
# [Unreleased]. The release commit ("Release x.y.z": VERSION and the changelog) and its
# tag are pushed back to main, and the GitHub release carries Pullse-<version>.zip and
# its .sha256, the two assets the in-app updater looks for. A push with no notes gets no
# release; its build is kept as a downloadable artifact instead.
#
# Pushes made with the workflow's own token don't start workflows, so the release commit
# doesn't trigger this again.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.0 or 1.1.0-beta.1). Empty derives it from the changelog.
        required: false

permissions:
  contents: write

# One at a time, never cancelled: a run cut short between pushing the tag and creating
# the release would leave a tag with no release.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags, so release.sh can refuse a version that already exists

      - name: Test
        run: scripts/test.sh

      - name: Prepare the release commit
        id: cut
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # A newer push is already queued behind this run and will release everything,
          # including this push's notes.
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main has moved on since this push; the newer run releases it."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$VERSION_INPUT" ] && ! scripts/next-version.sh >/dev/null; then
            echo "No notes under [Unreleased]: building without a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(scripts/release.sh $VERSION_INPUT)"
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "Releasing $version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        env:
          # A repository variable (Settings → Secrets and variables → Actions → Variables),
          # so the bundle id stays out of the code. Empty falls back to a placeholder.
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: make build

      - name: Package
        id: package
        env:
          RELEASE: ${{ steps.cut.outputs.release }}
        run: |
          suffix=""
          [ "$RELEASE" = true ] || suffix="+${GITHUB_RUN_NUMBER}"
          zip="$(scripts/package.sh "$suffix")"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      - name: Keep the build
        if: steps.cut.outputs.release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/Pullse-*.zip*
          retention-days: 14
          if-no-files-found: error

      # Only now, with the app built and packaged, does anything leave the runner.
      - name: Publish
        if: steps.cut.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --atomic origin HEAD:main "v$VERSION"
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" \
            "build/Pullse-$VERSION.zip" "build/Pullse-$VERSION.zip.sha256" \
            --title "Pullse $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${flags[@]}"
